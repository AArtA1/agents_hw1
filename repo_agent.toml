# Конфигурация агента. Ключи API здесь НЕ хранятся: только в переменных окружения
# (ANTHROPIC_API_KEY, GITHUB_TOKEN) или в локальном .env, который в .gitignore.
# Любое значение можно переопределить переменной окружения REPO_AGENT_<СЕКЦИЯ>_<КЛЮЧ>,
# например REPO_AGENT_LLM_MODEL=claude-sonnet-5-5.

[llm]
# Провайдер: "openai_compatible" (любой OpenAI-совместимый Chat Completions API) или "anthropic".
provider = "openai_compatible"
base_url = "https://api.silkcompute.com/v1"   # Silk Compute
api_key_env = "SILK_API_KEY"                  # имя переменной окружения с ключом (сам ключ — не здесь)
model = "kimi-k3.1-pro"                       # также: deepseek-v4.1-flash-1017, glm-5.3-flash
# Вариант с Claude:
# provider = "anthropic"
# model = "claude-opus-5-5"                   # ключ: ANTHROPIC_API_KEY
chat_effort = "medium"          # low | medium | high | xhigh | max
review_effort = "high"
timeout_seconds = 120           # таймаут одного запроса к модели
max_retries = 3
fallbacks = true                # серверный fallback на другую модель при отказе

[agent]
max_steps = 12                  # лимит шагов цикла (вызовов модели) на один вопрос
max_tool_output_chars = 20000   # результат любого инструмента обрезается до этого размера
max_line_chars = 400            # длинные (минифицированные) строки в read_file обрезаются
tool_timeout_seconds = 20       # таймаут внешних сервисов внутри инструментов (git, GitHub API, grep)

[actions]
# Действия с побочными эффектами выполняются только после подтверждения человеком.
# create_issue по умолчанию сохраняет черновик issue локально; публикация на GitHub —
# только если post_to_github = true, задан GITHUB_TOKEN и человек подтвердил.
post_to_github = false

[search]
mode = "hybrid"                 # hybrid = BM25 + векторный поиск (RRF) | bm25
embedding_model = "BAAI/bge-small-en-v1.5"   # локальная модель эмбеддингов (fastembed/ONNX, ~67 МБ, CPU)

[demo]
# Симуляция сбоя для демо: "<инструмент>:<timeout|error>", срабатывает на первом вызове.
# Например: fault = "read_file:timeout". Пусто — без сбоев.
fault = ""
